<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earnify Mini App</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #0f172a; color: #fff; margin-top: 50px; }
        .card { background: #1e293b; padding: 20px; border-radius: 10px; display: inline-block; }
        button { background: #22c55e; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; }
        button:hover { background: #16a34a; }
    </style>
</head>
<body>
    <div class="card">
        <h1>স্বাগতম Earnify-তে!</h1>
        <p>টাস্ক সম্পন্ন করুন এবং প্রতিদিন কয়েন ইনকাম করুন।</p>
        <button onclick="alert('ক্লেম করা হয়েছে!')">Claim Bonus</button>
    </div>
</body>
</html>
